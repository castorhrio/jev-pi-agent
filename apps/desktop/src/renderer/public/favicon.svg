<!-- Hand-vectorized counterpart of scripts/generate-icon.mjs — same tile, same
     gradient pair as styles.css .brand-mark, same checkmark geometry. If the
     generated icon changes, change this with it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15151d" />
      <stop offset="1" stop-color="#20202e" />
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d7cff" />
      <stop offset="1" stop-color="#9d6dff" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#tile)" stroke="rgba(255,255,255,0.06)" />
  <path
    d="M17.3 33.3 27.8 43.8 47.7 21.1"
    fill="none"
    stroke="url(#glyph)"
    stroke-width="5.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
