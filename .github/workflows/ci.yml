name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # `npm test` and the E2E suite drive a real Electron/Chromium window, which
    # needs a display. xvfb supplies one; the layout gate is the reason this job
    # is not a plain `node` run.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The Electron 44 toolchain (electron, @electron/get, @electron/rebuild)
          # and vitest 5 all declare `node >= 22.12`; Node 20 emitted a wall of
          # EBADENGINE warnings and npm 10's stricter lock validation failed on
          # peer entries that npm 11 never writes. 22 keeps the runner on the
          # version the dev toolchain actually targets.
          node-version: 22
          cache: npm

      - name: Install
        # The lock is written by npm 11 (the dev machines' bundled npm). npm 10
        # materialises the optional @emnapi peer entries npm 11 prunes, so the
        # two majors' `npm ci` cannot both validate one lock file — pin the
        # runner to the writer's version instead of chasing a shared shape.
        run: |
          npm install -g npm@11.6.2
          npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unused files, exports and dependencies
        run: npm run knip

      - name: Unit, contract and integration tests
        run: xvfb-run --auto-servernum npm test

      - name: Interface E2E
        run: xvfb-run --auto-servernum npm run test:e2e

      - name: Build
        run: npm run build

      - name: Clean build
        # The incremental build above cannot catch a wrong build order: a stale
        # `dist` satisfies any import. This is the check that does.
        run: |
          npm run clean
          npm run build:packages

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: layout-screenshots
          path: .run-logs/layout/
          if-no-files-found: ignore
